<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>接單管理後台｜LUMEN Photography</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    :root {
      --status-pending: #c28e2b;
      --status-confirmed: #2d7a8c;
      --status-deposit: #2a7c4f;
      --status-done: #534b8c;
      --status-delivered: #1a1a1a;
      --status-cancelled: #999999;
    }
    .admin-page {
      padding-top: calc(var(--header-h) + 24px);
      padding-bottom: 80px;
    }
    .admin-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 28px;
    }
    .admin-title h1 {
      font-size: clamp(22px, 3vw, 32px);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .admin-badge {
      font-size: 11px;
      letter-spacing: .2em;
      background: var(--text);
      color: #fff;
      padding: 3px 8px;
      text-transform: uppercase;
      font-family: var(--font-sans);
      font-weight: 500;
    }
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 20px;
      border-radius: 4px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .stat-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.04);
      transform: translateY(-2px);
    }
    .stat-card__label {
      font-size: 12px;
      letter-spacing: .15em;
      color: var(--text-soft);
      margin-bottom: 8px;
      display: block;
    }
    .stat-card__val {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 600;
      line-height: 1.1;
      color: var(--text);
    }
    .stat-card__sub {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 6px;
    }

    /* Controls Bar */
    .controls-panel {
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 16px 20px;
      border-radius: 4px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
    }
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tab-btn {
      padding: 6px 14px;
      font-size: 13px;
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 20px;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .06em;
    }
    .tab-btn:hover {
      border-color: var(--text);
    }
    .tab-btn.is-active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .tab-btn .badge-num {
      margin-left: 4px;
      font-size: 11px;
      opacity: .85;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 240px;
      flex: 1;
      max-width: 360px;
    }
    .search-box input {
      width: 100%;
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--text);
    }

    /* Booking Cards List */
    .booking-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .booking-item {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 24px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .booking-item:hover {
      border-color: #ccc;
      box-shadow: 0 4px 18px rgba(0,0,0,.03);
    }
    .booking-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .booking-title-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    .booking-no {
      font-family: monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .booking-date-badge {
      font-size: 12px;
      color: var(--text-soft);
    }
    .status-badge {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 12px;
      font-weight: 500;
      letter-spacing: .05em;
    }
    .status-badge.待溝通 { background: #fef3c7; color: #92400e; }
    .status-badge.已確認檔期 { background: #e0f2fe; color: #0369a1; }
    .status-badge.已付訂金 { background: #dcfce7; color: #15803d; }
    .status-badge.已拍攝完成 { background: #f3e8ff; color: #6b21a8; }
    .status-badge.已交付成品 { background: #f1f5f9; color: #334155; }
    .status-badge.已取消 { background: #f3f4f6; color: #6b7280; text-decoration: line-through; }

    .booking-body {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr 1.6fr;
      gap: 20px;
      font-size: 14px;
    }
    @media (max-width: 900px) {
      .booking-body { grid-template-columns: 1fr; }
    }
    .info-block h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .15em;
      color: var(--text-soft);
      margin-bottom: 8px;
    }
    .info-block p {
      margin: 0 0 6px;
      line-height: 1.6;
    }
    .client-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .contact-link {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .contact-link:hover {
      color: var(--accent);
    }
    .booking-plan-box {
      background: var(--bg-soft);
      padding: 12px 14px;
      border-radius: 4px;
      margin-top: 6px;
    }
    .plan-title {
      font-weight: 600;
      color: var(--text);
    }
    .plan-shoot-date {
      color: #92400e;
      font-weight: 500;
      margin-top: 4px;
    }
    .plan-deposit {
      font-size: 12px;
      color: var(--text-soft);
      margin-top: 4px;
    }

    .booking-actions {
      border-top: 1px solid var(--line);
      margin-top: 18px;
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .status-select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .status-select-wrap select {
      padding: 6px 12px;
      font-size: 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #ffffff;
      outline: none;
      cursor: pointer;
    }
    .action-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
      letter-spacing: .08em;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      transition: all .2s;
    }
    .btn-sm:hover {
      background: var(--text);
      color: #ffffff;
      border-color: var(--text);
    }
    .btn-del {
      color: #b0413e;
      border-color: #fca5a5;
    }
    .btn-del:hover {
      background: #b0413e;
      color: #fff;
      border-color: #b0413e;
    }
    .note-input-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .note-input-row input {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fafafa;
    }
    .empty-state {
      background: #ffffff;
      border: 1px dashed var(--line);
      padding: 48px 24px;
      text-align: center;
      color: var(--text-soft);
      border-radius: 6px;
    }
    .server-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #eef2ff;
      color: #4338ca;
    }
    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }
  </style>
  <meta name="robots" content="noindex, nofollow">
</head>
<body data-page="admin">
  <header class="site-header" id="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        LUMEN <small>PHOTOGRAPHY</small>
      </a>
      <div style="display:flex;align-items:center;gap:16px;">
        <span class="server-status-pill" id="server-status"><span class="dot-live"></span> 連線正常</span>
        <a href="index.html" class="btn-sm" style="text-decoration:none;">回官網前台</a>
      </div>
    </div>
  </header>

  <main id="app">
    <div class="container admin-page">
      <!-- Admin Header -->
      <div class="admin-header-bar">
        <div class="admin-title">
          <h1>攝影師接單管理系統 <span class="admin-badge">Admin</span></h1>
          <p style="color:var(--text-soft);margin-top:4px;font-size:14px;">即時掌握預約諮詢、客戶拍攝需求、檔期排程與訂金收繳狀態</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn-sm" id="btn-refresh" title="重新載入資料">🔄 重新整理</button>
          <button class="btn-sm" id="btn-test-sound" title="測試語音廣播提示">🔊 測試音效</button>
          <button class="btn-sm" id="btn-export-json" title="匯出所有預約為 JSON">💾 匯出資料</button>
          <a href="contact.html" target="_blank" class="btn-sm" style="text-decoration:none;">➕ 模擬填寫表單</a>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-card__label">總預約單數</span>
          <div class="stat-card__val" id="stat-total">0</div>
          <div class="stat-card__sub">累計所有諮詢</div>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">待溝通洽談</span>
          <div class="stat-card__val" style="color:#d97706" id="stat-pending">0</div>
          <div class="stat-card__sub">需盡快聯繫回覆</div>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">已確認檔期</span>
          <div class="stat-card__val" style="color:#0284c7" id="stat-confirmed">0</div>
          <div class="stat-card__sub">拍攝日期已敲定</div>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">已收訂金</span>
          <div class="stat-card__val" style="color:#16a34a" id="stat-deposit">0</div>
          <div class="stat-card__sub">已付 30% 保留檔期</div>
        </div>
        <div class="stat-card">
          <span class="stat-card__label">預估金額總計</span>
          <div class="stat-card__val" style="font-size:24px;margin-top:6px;" id="stat-revenue">NT$ 0</div>
          <div class="stat-card__sub" id="stat-deposit-sum">訂金合計: NT$ 0</div>
        </div>
      </div>

      <!-- Filter and Search Toolbar -->
      <div class="controls-panel">
        <div class="filter-tabs" id="status-tabs">
          <button class="tab-btn is-active" data-status="all">全部 <span class="badge-num" id="badge-all">0</span></button>
          <button class="tab-btn" data-status="待溝通">待溝通 <span class="badge-num" id="badge-pending">0</span></button>
          <button class="tab-btn" data-status="已確認檔期">已確認檔期 <span class="badge-num" id="badge-confirmed">0</span></button>
          <button class="tab-btn" data-status="已付訂金">已付訂金 <span class="badge-num" id="badge-deposit">0</span></button>
          <button class="tab-btn" data-status="已拍攝完成">已拍攝完成 <span class="badge-num" id="badge-done">0</span></button>
          <button class="tab-btn" data-status="已交付成品">已交付成品 <span class="badge-num" id="badge-delivered">0</span></button>
          <button class="tab-btn" data-status="已取消">已取消 <span class="badge-num" id="badge-cancelled">0</span></button>
        </div>

        <div class="search-box">
          <input type="text" id="search-input" placeholder="🔍 搜尋姓名、電話、LINE、單號...">
        </div>
      </div>

      <!-- Bookings List -->
      <div class="booking-list" id="booking-list">
        <div class="empty-state">正在載入預約清單...</div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© LUMEN Photography 接單管理中心 • 支援自動持久化儲存與語音廣播提示</small>
    </div>
  </footer>

  <script>
    (function() {
      'use strict';

      let allBookings = [];
      let currentFilter = 'all';
      let searchQuery = '';

      const $ = (sel) => document.querySelector(sel);
      const $$ = (sel) => Array.from(document.querySelectorAll(sel));
      const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      // 載入預約資料
      async function fetchBookings() {
        const statusEl = $('#server-status');
        try {
          const res = await fetch('/api/bookings?t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            allBookings = data.bookings || [];
            statusEl.innerHTML = '<span class="dot-live"></span> 連線正常 (API)';
          } else {
            throw new Error('API 回應非 200');
          }
        } catch (err) {
          // Fallback: 嘗試讀取 data/bookings.json
          try {
            const fbRes = await fetch('data/bookings.json?t=' + Date.now());
            if (fbRes.ok) {
              allBookings = await fbRes.json();
              statusEl.innerHTML = '<span class="dot-live" style="background:#f59e0b;box-shadow:0 0 6px #f59e0b"></span> 靜態檔案讀取 (唯讀)';
            } else {
              throw new Error('靜態檔案讀取失敗');
            }
          } catch (e) {
            statusEl.innerHTML = '<span class="dot-live" style="background:#ef4444;box-shadow:0 0 6px #ef4444"></span> 伺服器未連線';
            console.error('Fetch bookings error:', e);
          }
        }

        renderDashboard();
      }

      // 更新預約狀態
      async function updateBookingStatus(id, newStatus, note) {
        try {
          const payload = {};
          if (newStatus) payload.status = newStatus;
          if (note !== undefined) payload.note = note;

          const res = await fetch(`/api/bookings/${encodeURIComponent(id)}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            const result = await res.json();
            // 本地資料同步更新
            const target = allBookings.find(b => b.id === id || b.bookingNumber === id);
            if (target) {
              if (newStatus) target.status = newStatus;
              if (note !== undefined) target.internalNote = note;
            }
            renderDashboard();
            showToast('✅ 預約狀態已更新為：' + (newStatus || '已存檔'));
          } else {
            alert('更新失敗，請確認本地伺服器正在運行 (node server.js 或 start.bat)。');
          }
        } catch (err) {
          alert('無法連接伺服器：' + err.message);
        }
      }

      // 刪除預約
      async function deleteBooking(id, bNum) {
        if (!confirm(`確定要刪除預約單【${bNum}】嗎？此動作無法復原。`)) return;

        try {
          const res = await fetch(`/api/bookings/${encodeURIComponent(id)}`, {
            method: 'DELETE'
          });

          if (res.ok) {
            allBookings = allBookings.filter(b => b.id !== id && b.bookingNumber !== id);
            renderDashboard();
            showToast(`🗑️ 預約單 ${bNum} 已刪除`);
          } else {
            alert('刪除失敗');
          }
        } catch (err) {
          alert('伺服器錯誤：' + err.message);
        }
      }

      // 渲染儀表板與統計數字
      function renderDashboard() {
        // 統計數字
        const total = allBookings.length;
        const pending = allBookings.filter(b => (b.status || '待溝通') === '待溝通').length;
        const confirmed = allBookings.filter(b => b.status === '已確認檔期').length;
        const deposit = allBookings.filter(b => b.status === '已付訂金').length;
        const done = allBookings.filter(b => b.status === '已拍攝完成').length;
        const delivered = allBookings.filter(b => b.status === '已交付成品').length;
        const cancelled = allBookings.filter(b => b.status === '已取消').length;

        // 金額總計
        let revSum = 0;
        let depSum = 0;
        allBookings.forEach(b => {
          if (b.status !== '已取消') {
            revSum += (b.totalEstimate || 0);
            depSum += (b.deposit || 0);
          }
        });

        $('#stat-total').textContent = total;
        $('#stat-pending').textContent = pending;
        $('#stat-confirmed').textContent = confirmed;
        $('#stat-deposit').textContent = deposit;
        $('#stat-revenue').textContent = 'NT$ ' + revSum.toLocaleString();
        $('#stat-deposit-sum').textContent = `訂金合計: NT$ ${depSum.toLocaleString()}`;

        // 頁籤標籤數量
        $('#badge-all').textContent = total;
        $('#badge-pending').textContent = pending;
        $('#badge-confirmed').textContent = confirmed;
        $('#badge-deposit').textContent = deposit;
        $('#badge-done').textContent = done;
        $('#badge-delivered').textContent = delivered;
        $('#badge-cancelled').textContent = cancelled;

        // 篩選與搜尋
        let filtered = allBookings.filter(b => {
          if (currentFilter !== 'all') {
            const st = b.status || '待溝通';
            if (st !== currentFilter) return false;
          }
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const hit = (b.name || '').toLowerCase().includes(q) ||
                        (b.phone || '').toLowerCase().includes(q) ||
                        (b.line || '').toLowerCase().includes(q) ||
                        (b.email || '').toLowerCase().includes(q) ||
                        (b.bookingNumber || '').toLowerCase().includes(q) ||
                        (b.type || '').toLowerCase().includes(q) ||
                        (b.message || '').toLowerCase().includes(q);
            if (!hit) return false;
          }
          return true;
        });

        const listContainer = $('#booking-list');
        if (filtered.length === 0) {
          listContainer.innerHTML = `
            <div class="empty-state">
              <h3>無符合條件的預約單</h3>
              <p>可以嘗試切換上方狀態標籤，或清除搜尋關鍵字。</p>
            </div>
          `;
          return;
        }

        listContainer.innerHTML = filtered.map(b => {
          const status = b.status || '待溝通';
          const createTime = b.createdAt ? new Date(b.createdAt).toLocaleString('zh-TW', { hour12: false }) : '未知時間';
          const totalEst = (b.totalEstimate || 0).toLocaleString();
          const depEst = (b.deposit || 0).toLocaleString();

          // 製作 Google 日曆連結
          let gCalUrl = '#';
          if (b.date && b.date !== '尚未決定') {
            const cleanDate = b.date.replace(/-/g, '');
            const title = encodeURIComponent(`【攝影】${b.name} - ${b.type}`);
            const desc = encodeURIComponent(`單號: ${b.bookingNumber}\n客戶: ${b.name}\n電話: ${b.phone}\nLINE: ${b.line}\n備註: ${b.message}`);
            gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${cleanDate}T090000/${cleanDate}T120000&details=${desc}`;
          }

          return `
            <div class="booking-item" data-id="${esc(b.id || b.bookingNumber)}">
              <div class="booking-header">
                <div class="booking-title-group">
                  <span class="booking-no">${esc(b.bookingNumber || 'PHO-PENDING')}</span>
                  <span class="booking-date-badge">填表時間：${esc(createTime)}</span>
                </div>
                <span class="status-badge ${esc(status)}">${esc(status)}</span>
              </div>

              <div class="booking-body">
                <!-- 區塊 1: 客戶聯繫資訊 -->
                <div class="info-block">
                  <h4>客戶資訊</h4>
                  <p class="client-name">${esc(b.name || '未提供姓名')}</p>
                  <p>
                    📞 電話：${b.phone ? `<a href="tel:${esc(b.phone)}" class="contact-link">${esc(b.phone)}</a>` : '<span style="color:#aaa">未填</span>'}
                  </p>
                  <p>
                    ✉️ 信箱：${b.email ? `<a href="mailto:${esc(b.email)}" class="contact-link">${esc(b.email)}</a>` : '<span style="color:#aaa">未填</span>'}
                  </p>
                  <p>
                    💬 LINE：${b.line ? `<strong>${esc(b.line)}</strong>` : '<span style="color:#aaa">未填</span>'}
                  </p>
                </div>

                <!-- 區塊 2: 方案與預計拍攝 -->
                <div class="info-block">
                  <h4>預約方案與檔期</h4>
                  <div class="booking-plan-box">
                    <div class="plan-title">${esc(b.type || '未指定方案')}</div>
                    <div class="plan-shoot-date">📅 拍攝日期：${esc(b.date || '尚未決定')}</div>
                    <div class="plan-deposit">💰 預估費用：NT$ ${totalEst} (訂金 30%：NT$ ${depEst})</div>
                  </div>
                </div>

                <!-- 區塊 3: 客戶需求與內部備忘 -->
                <div class="info-block">
                  <h4>需求內容與內部筆記</h4>
                  <p style="white-space:pre-wrap;background:#fafafa;padding:10px;border-radius:4px;font-size:13px;border:1px solid #eee;">${esc(b.message || '無特殊備註')}</p>
                  
                  <div class="note-input-row">
                    <input type="text" class="internal-note-input" placeholder="新增內部備忘（例：已收到訂金匯款）..." value="${esc(b.internalNote || '')}">
                    <button class="btn-sm btn-save-note" data-id="${esc(b.id || b.bookingNumber)}">存備忘</button>
                  </div>
                </div>
              </div>

              <!-- 底部操作列 -->
              <div class="booking-actions">
                <div class="status-select-wrap">
                  <label>變更狀態：</label>
                  <select class="status-selector" data-id="${esc(b.id || b.bookingNumber)}">
                    <option value="待溝通" ${status === '待溝通' ? 'selected' : ''}>⏳ 待溝通</option>
                    <option value="已確認檔期" ${status === '已確認檔期' ? 'selected' : ''}>📅 已確認檔期</option>
                    <option value="已付訂金" ${status === '已付訂金' ? 'selected' : ''}>💵 已付訂金</option>
                    <option value="已拍攝完成" ${status === '已拍攝完成' ? 'selected' : ''}>📷 已拍攝完成</option>
                    <option value="已交付成品" ${status === '已交付成品' ? 'selected' : ''}>✨ 已交付成品</option>
                    <option value="已取消" ${status === '已取消' ? 'selected' : ''}>❌ 已取消</option>
                  </select>
                </div>

                <div class="action-btns">
                  ${b.date && b.date !== '尚未決定' ? `<a href="${gCalUrl}" target="_blank" rel="noopener" class="btn-sm" style="text-decoration:none;">📅 加 Google 日曆</a>` : ''}
                  <button class="btn-sm btn-copy-summary" data-json="${esc(JSON.stringify(b))}">📋 複製預約簡報</button>
                  <button class="btn-sm btn-tts" data-name="${esc(b.name)}" data-type="${esc(b.type)}">🔊 朗讀</button>
                  <button class="btn-sm btn-del" data-id="${esc(b.id || b.bookingNumber)}" data-bnum="${esc(b.bookingNumber)}">🗑️ 刪除</button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        attachItemEvents();
      }

      // 綁定項目操作事件
      function attachItemEvents() {
        // 狀態下拉改變
        $$('.status-selector').forEach(sel => {
          sel.addEventListener('change', (e) => {
            const id = e.target.dataset.id;
            const newStatus = e.target.value;
            updateBookingStatus(id, newStatus);
          });
        });

        // 儲存備忘按鈕
        $$('.btn-save-note').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = btn.dataset.id;
            const card = btn.closest('.booking-item');
            const noteInput = card.querySelector('.internal-note-input');
            const noteVal = noteInput.value.trim();
            updateBookingStatus(id, null, noteVal);
          });
        });

        // 複製預約簡報文字
        $$('.btn-copy-summary').forEach(btn => {
          btn.addEventListener('click', () => {
            try {
              const b = JSON.parse(btn.dataset.json);
              const text = `【LUMEN 攝影預約單】\n單號：${b.bookingNumber}\n客戶：${b.name}\n電話：${b.phone || '無'}\nLINE：${b.line || '無'}\nEmail：${b.email || '無'}\n方案：${b.type}\n預計日期：${b.date}\n狀態：${b.status}\n預估費用：NT$ ${b.totalEstimate} (訂金 NT$ ${b.deposit})\n需求：${b.message || '無'}`;
              navigator.clipboard.writeText(text).then(() => {
                showToast('📋 預約簡報已複製至剪貼簿！');
              });
            } catch (err) {
              alert('複製失敗');
            }
          });
        });

        // 朗讀
        $$('.btn-tts').forEach(btn => {
          btn.addEventListener('click', () => {
            const name = btn.dataset.name;
            const type = btn.dataset.type;
            const msg = `預約客戶：${name}，預約方案：${type}`;
            if ('speechSynthesis' in window) {
              const u = new SpeechSynthesisUtterance(msg);
              u.lang = 'zh-TW';
              window.speechSynthesis.speak(u);
            } else {
              alert(msg);
            }
          });
        });

        // 刪除按鈕
        $$('.btn-del').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const bnum = btn.dataset.bnum;
            deleteBooking(id, bnum);
          });
        });
      }

      // 提示小訊息 (Toast)
      function showToast(msg) {
        let toast = $('#toast-box');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'toast-box';
          toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:6px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9999;transition:all .3s ease;transform:translateY(100px);opacity:0;pointer-events:none;';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.transform = 'translateY(0)';
        toast.style.opacity = '1';
        setTimeout(() => {
          toast.style.transform = 'translateY(100px)';
          toast.style.opacity = '0';
        }, 2800);
      }

      // 監聽頁籤切換
      $$('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          $$('.tab-btn').forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          currentFilter = btn.dataset.status;
          renderDashboard();
        });
      });

      // 搜尋關鍵字輸入
      $('#search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        renderDashboard();
      });

      // 重新整理
      $('#btn-refresh').addEventListener('click', () => {
        fetchBookings();
        showToast('🔄 已重新整理預約列表');
      });

      // 測試音效
      $('#btn-test-sound').addEventListener('click', () => {
        if ('speechSynthesis' in window) {
          const u = new SpeechSynthesisUtterance('攝影師接單系統運作正常，收到新訂單將立即語音通知');
          u.lang = 'zh-TW';
          window.speechSynthesis.speak(u);
        }
        showToast('🔊 語音提示播放中');
      });

      // 匯出 JSON
      $('#btn-export-json').addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allBookings, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `lumen_bookings_${new Date().toISOString().slice(0,10)}.json`);
        dlAnchor.click();
        showToast('💾 預約資料已匯出下載');
      });

      // 定期輪詢 (每 20 秒檢查是否有新預約)
      setInterval(() => {
        fetchBookings();
      }, 20000);

      // 初次啟動載入
      fetchBookings();
    })();
  </script>
</body>
</html>
