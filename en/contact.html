<body data-page="contact">
  <header class="site-header" id="site-header"><div class="container"><a class="brand" href="index.html">LUMEN <small>Photography</small></a><nav class="nav"><a href="index.html">Home</a><a href="works.html">Portfolio</a><a href="about.html">About Me</a><a href="services.html">Services &amp; Pricing</a><a href="contact.html">Contact</a></nav></div></header>
  <main id="app">
    <div class="page container">
      <div class="page-sheet">
        <header class="page-head">
          <span class="eyebrow">Contact</span>
          <h1>Book a Consultation</h1>
          <p>Tell me what you would like to photograph, your preferred date and location. I aim to reply within 1–2 business days.</p>
        </header>

        <div class="contact">
        <!-- 聯絡資訊由 app.js 依 content/site.json 填入 -->
        <aside class="contact-info" id="contact-info"></aside>

        <!--
          表單由 Netlify Forms 接收（網站需部署在 Netlify 才能送出）。
          送出的內容可在 Netlify 後台 Forms 查看，也可設定寄到你的 Email。
          若改欄位名稱，Netlify 需重新部署才會偵測到。
        -->
        <form class="form" id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="contact">
          <p class="visually-hidden" aria-hidden="true">
            <label>Leave this field empty <input name="bot-field" tabindex="-1" autocomplete="off"></label>
          </p>

          <div class="field">
            <label for="f-name">Name <span class="req">*</span></label>
            <input id="f-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="f-email">Email <span class="req">*</span></label>
            <input id="f-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="f-phone">Phone</label>
            <input id="f-phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div class="field">
            <label for="f-line">LINE ID</label>
            <input id="f-line" name="line" type="text">
          </div>
          <div class="field">
            <label for="f-type">Session Type <span class="req">*</span></label>
            <select id="f-type" name="type" required>
              <option value="">Please select</option>
              <!-- 其餘選項由 app.js 依作品分類自動加入 -->
            </select>
          </div>
          <div class="field">
            <label for="f-date">Preferred Date</label>
            <input id="f-date" name="date" type="date">
          </div>
          <div class="field full">
            <label for="f-message">What do you have in mind? <span class="req">*</span></label>
            <textarea id="f-message" name="message" placeholder="For example: number of people, location, style and budget..." required></textarea>
          </div>
          <div class="full">
            <button class="btn btn--solid" type="submit">Send</button>
          </div>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>
</main>
